# RoboCasa v0.1 single_stage atomic demos (demo_gentex_im128_randcams.hdf5).
# HDF5 obs keys match robomimic/RoboCasa naming (not LIBERO agentview_rgb).
# HDF5 actions are 12-dim (see robocasa.utils.env_utils.convert_action): 0:7 arm, 7:11 base, 11:12 mode.
_target_: datasets.robomimic.make_robomimic_dataset
name: robocasa_atomic_template
hdf5_path_globs: /data/shared_workspace/zhangshiqi/dataset/robocasa/v0.1/single_stage/placeholder/demo_gentex_im128_randcams.hdf5
buffer_path: /data/shared_workspace/zhangshiqi/dataset/robocasa/v0.1/single_stage/placeholder/demo_gentex_im128_randcams.zarr
shape_meta:
  obs:
    robot0_agentview_left_image: &cam
      shape: [128, 128, 3]
      type: rgb
    robot0_agentview_right_image: *cam
    robot0_eye_in_hand_image: *cam
  action:
    shape: [7] # pos + quarternion + gripper
# Half-open slice on stored action vectors before writing zarr (arm only)
action_slice: [0, 7]
seq_len: ${num_frames}
val_ratio: 0.05
subsample_ratio: 1.0
flip_rgb: False
